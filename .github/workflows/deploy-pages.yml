name: Deploy Steal the Moon

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate every data JSON file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/*.json)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Run repository smoke check
        run: python3 scripts/check.py

      - name: Verify exported browser artifact
        run: python3 scripts/check_web.py

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
